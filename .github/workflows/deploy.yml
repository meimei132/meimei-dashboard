name: 每日自动更新数据并部署

on:
  schedule:
    # 每天早上8点运行（北京时间）
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 安装 pnpm
        run: npm install -g pnpm
      
      - name: 安装依赖
        run: pnpm install
      
      - name: 抓取飞书数据
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: node scripts/fetch-from-doc.js
      
      - name: 提交数据更新
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/lib/mock-data.ts
          git diff --staged --quiet || git commit -m "chore: 自动更新飞书数据 $(date +%Y-%m-%d)"
          git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git
          git push origin main
      
      - name: 部署到 Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: meimei-dashboard
          directory: out
          branch: main
